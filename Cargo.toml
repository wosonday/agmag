[package]
name = "agmag"
version = "0.3.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
comfy-table = "8.0.1"
dirs = "7.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
walkdir = "2.5.0"
unicode-width = "0.2.3"
unicode-segmentation = "1.13.3"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk"] }

# Pane size for `agm tui` (both crates are already in the lock file through other dependencies).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "agm"
path = "src/main.rs"
