[package]
name = "agmag"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
comfy-table = "8.0.1"
dirs = "7.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "agm"
path = "src/main.rs"
