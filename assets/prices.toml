# Built-in list prices, USD per 1M tokens, used by `agm cost` / `agm tui` to show what usage is worth at API rates.
# Snapshot 2026-11-20 from the providers' public API prices (models.dev catalog; Claude rates checked against
# Anthropic's published table). Base tier only: long-context surcharges (GPT > 272k, Claude Haiku 5.5 > 100k) are
# not applied. Missing cache_write = input price. Override any entry with [models."<id>".price] in providers.toml.
# Keys are bare model ids; OpenCode `provider/id`, dated ids (`-20251001`) and agy effort suffixes (`-high`) are
# matched after stripping. Ids ending in `-free` / `:free` cost $0. Models not listed here show "?".

